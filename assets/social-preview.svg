<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#0d1117"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- left text block -->
  <text x="90" y="112" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" letter-spacing="6" fill="#8b949e">COMPETITION MATH DATABASE</text>

  <text x="86" y="192" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="80" font-weight="700" fill="#e6edf3">arquimedes</text>

  <text x="90" y="300" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="84" font-weight="700" fill="#58a6ff">1,038,963<tspan dx="18" font-size="40" font-weight="600" fill="#e6edf3">math problems</tspan></text>

  <text x="90" y="352" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="30" fill="#c9d1d9">full statements, answers, and solutions</text>
  <text x="90" y="394" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="26" fill="#8b949e">raw LaTeX &#183; gzipped JSONL shards &#183; SQLite build</text>

  <!-- chips -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#79c0ff">
    <rect x="90"  y="425" width="148" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
    <text x="164" y="453" text-anchor="middle">9 datasets</text>
    <rect x="254" y="425" width="232" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
    <text x="370" y="453" text-anchor="middle">797,672 solutions</text>
    <rect x="502" y="425" width="196" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
    <text x="600" y="453" text-anchor="middle">1,219 diagrams</text>
    <rect x="714" y="425" width="136" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
    <text x="782" y="453" text-anchor="middle">CC BY 4.0</text>
  </g>

  <text x="90" y="562" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" fill="#6e7681">AHSME &#183; AMC 8/10/12 &#183; AIME &#183; USAMO &#183; IMO + Shortlist &#183; HMMT &#183; CEMC &#183; Putnam &#183; MATH</text>

  <!-- right math motif: Thales circle -->
  <g>
    <circle cx="1055" cy="300" r="140" fill="none" stroke="#e3b341" stroke-width="2.5" stroke-opacity="0.9"/>
    <circle cx="1055" cy="300" r="3.5" fill="#e3b341"/>
    <path d="M915 300 L1195 300 L995.9 173.1 Z" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="915" cy="300" r="4.5" fill="#58a6ff"/>
    <circle cx="1195" cy="300" r="4.5" fill="#58a6ff"/>
    <circle cx="995.9" cy="173.1" r="4.5" fill="#58a6ff"/>
    <!-- right-angle marker at the top vertex -->
    <path d="M985.9 188.4 L1001.2 198.4 L1011.2 183.1" fill="none" stroke="#e3b341" stroke-width="2"/>
    <text x="940" y="292" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#8b949e">&#952;</text>
  </g>

  <!-- floating formulas -->
  <text x="905" y="105" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#d2a8ff">&#8721; 1/n&#178; = &#960;&#178;/6</text>
  <text x="895" y="520" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#79c0ff">a&#178; + b&#178; = c&#178;</text>
  <text x="1010" y="592" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="32" fill="#e3b341">e<tspan baseline-shift="super" font-size="22">i&#960;</tspan><tspan dx="4">+ 1 = 0</tspan></text>
</svg>
