<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <!-- Deep obsidian-slate ground -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="55%" stop-color="#0A0F18"/>
      <stop offset="100%" stop-color="#0E1524"/>
    </linearGradient>

    <!-- Focused radial glow behind the geometric plate -->
    <radialGradient id="plateGlow" cx="76%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#0F233C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>

    <!-- Precision architectural grid (32px minor, 160px major) -->
    <pattern id="minorGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.30"/>
    </pattern>
    <pattern id="majorGrid" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="url(#minorGrid)"/>
      <path d="M 160 0 L 0 0 0 160" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.38"/>
    </pattern>

    <!-- Gold accent rule -->
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#E5A93C" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E5A93C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#majorGrid)"/>
  <rect width="1280" height="640" fill="url(#plateGlow)"/>

  <!-- Outer Frame & Corner Registration Crosshairs -->
  <rect x="32" y="32" width="1216" height="576" fill="none" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="38" y="38" width="1204" height="564" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.6"/>

  <g stroke="#E5A93C" stroke-width="1.2" stroke-opacity="0.8">
    <path d="M 25 32 H 41 M 32 25 V 41"/>
    <path d="M 1239 32 H 1255 M 1248 25 V 41"/>
    <path d="M 25 608 H 41 M 32 599 V 615"/>
    <path d="M 1239 608 H 1255 M 1248 599 V 615"/>
  </g>

  <!-- Vertical Structural Divider (x = 704) -->
  <line x1="704" y1="38" x2="704" y2="602" stroke="#1E293B" stroke-width="1.2"/>
  <line x1="704" y1="160" x2="704" y2="480" stroke="#E5A93C" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- ======================================================================= -->
  <!-- LEFT PANEL: MONUMENTAL TYPOGRAPHY & HIGH-CONTRAST METRICS               -->
  <!-- ======================================================================= -->

  <!-- Top Index Line -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="2.2" fill="#94A3B8">
    <text x="76" y="88" fill="#E5A93C" font-weight="600">CORPUS MATHEMATICUM</text>
    <text x="310" y="88" fill="#334155">/</text>
    <text x="332" y="88">JSONL + SQLITE</text>
    <text x="502" y="88" fill="#334155">/</text>
    <text x="524" y="88" fill="#4BA3E3">CC BY 4.0</text>
  </g>

  <!-- Monumental Classical Serif Title -->
  <text x="72" y="206" font-family="'Palatino', 'Baskerville', 'Times New Roman', Georgia, serif" font-size="96" font-weight="700" letter-spacing="-1.8" fill="#F4F1EA">Arquimedes</text>

  <!-- Clear, Restrained Subtitle -->
  <text x="76" y="256" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">
    Open database of competition &amp; olympiad mathematics
  </text>

  <!-- ======================================================================= -->
  <!-- 2x2 ARCHITECTURAL METRIC LEDGER (HIGH LEGIBILITY AT ANY SCALE)          -->
  <!-- ======================================================================= -->
  <line x1="76" y1="296" x2="656" y2="296" stroke="url(#goldRule)" stroke-width="1.5"/>
  <line x1="76" y1="402" x2="656" y2="402" stroke="#1E293B" stroke-width="1"/>
  <line x1="76" y1="508" x2="656" y2="508" stroke="#1E293B" stroke-width="1.2"/>
  <line x1="366" y1="296" x2="366" y2="508" stroke="#1E293B" stroke-width="1"/>

  <!-- Cell 1 (Top-Left): Total Problems -->
  <text x="76" y="348" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" letter-spacing="-1" fill="#F4F1EA">1,038,963</text>
  <text x="76" y="378" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#E5A93C" font-weight="600">PROBLEMS</text>
  <text x="162" y="378" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14" fill="#64748B">· 9 deduplicated datasets</text>

  <!-- Cell 2 (Top-Right): Written Solutions -->
  <text x="392" y="348" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" letter-spacing="-1" fill="#F4F1EA">797,672</text>
  <text x="392" y="378" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#4BA3E3" font-weight="600">SOLUTIONS</text>
  <text x="488" y="378" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14" fill="#64748B">· proofs &amp; sketches</text>

  <!-- Cell 3 (Bottom-Left): Reasoning Traces -->
  <text x="76" y="454" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" letter-spacing="-1" fill="#F4F1EA">277,002</text>
  <text x="76" y="484" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#94A3B8" font-weight="600">R1 TRACES</text>
  <text x="168" y="484" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14" fill="#64748B">· step-by-step CoT</text>

  <!-- Cell 4 (Bottom-Right): Diagrams -->
  <text x="392" y="454" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" letter-spacing="-1" fill="#F4F1EA">1,219</text>
  <text x="392" y="484" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#94A3B8" font-weight="600">DIAGRAMS</text>
  <text x="484" y="484" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14" fill="#64748B">· vector SVG &amp; JPG</text>

  <!-- Bottom Provenance Line -->
  <text x="76" y="558" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13.5" fill="#94A3B8" letter-spacing="0.4">
    IMO · USAMO · Putnam · AIME · AMC · HMMT · MATH · Omni-MATH · Numina
  </text>

  <!-- ======================================================================= -->
  <!-- RIGHT PANEL: ARCHIMEDES' SPHERE & CYLINDER + EULER NINE-POINT PLATE     -->
  <!-- Center at (976, 314)                                                    -->
  <!-- ======================================================================= -->

  <!-- Top Plate Header -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" letter-spacing="1.4" fill="#64748B">
    <text x="744" y="88">FIG. I — DE SPHAERA ET CYLINDRO</text>
    <text x="1208" y="88" text-anchor="end" fill="#E5A93C">1 : 2 : 3</text>
  </g>

  <!-- Geometric Construction Group centered at (976, 316) -->
  <g transform="translate(976, 316)">

    <!-- Outer Compass Rings (r = 204, r = 195) -->
    <circle cx="0" cy="0" r="204" fill="none" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="195" fill="none" stroke="#334155" stroke-width="0.65"/>

    <!-- Graduated 15-degree Compass Ticks -->
    <g stroke="#475569" stroke-width="0.9">
      <line x1="0" y1="-204" x2="0" y2="-190" stroke="#E5A93C" stroke-width="1.4"/>
      <line x1="0" y1="190" x2="0" y2="204" stroke="#E5A93C" stroke-width="1.4"/>
      <line x1="-204" y1="0" x2="-190" y2="0" stroke="#E5A93C" stroke-width="1.4"/>
      <line x1="190" y1="0" x2="204" y2="0" stroke="#E5A93C" stroke-width="1.4"/>
      <g transform="rotate(15)"><line x1="0" y1="-204" x2="0" y2="-196"/><line x1="0" y1="196" x2="0" y2="204"/><line x1="-204" y1="0" x2="-196" y2="0"/><line x1="196" y1="0" x2="204" y2="0"/></g>
      <g transform="rotate(30)"><line x1="0" y1="-204" x2="0" y2="-193"/><line x1="0" y1="193" x2="0" y2="204"/><line x1="-204" y1="0" x2="-193" y2="0"/><line x1="193" y1="0" x2="204" y2="0"/></g>
      <g transform="rotate(45)"><line x1="0" y1="-204" x2="0" y2="-193"/><line x1="0" y1="193" x2="0" y2="204"/><line x1="-204" y1="0" x2="-193" y2="0"/><line x1="193" y1="0" x2="204" y2="0"/></g>
      <g transform="rotate(60)"><line x1="0" y1="-204" x2="0" y2="-193"/><line x1="0" y1="193" x2="0" y2="204"/><line x1="-204" y1="0" x2="-193" y2="0"/><line x1="193" y1="0" x2="204" y2="0"/></g>
      <g transform="rotate(75)"><line x1="0" y1="-204" x2="0" y2="-196"/><line x1="0" y1="196" x2="0" y2="204"/><line x1="-204" y1="0" x2="-196" y2="0"/><line x1="196" y1="0" x2="204" y2="0"/></g>
    </g>

    <!-- Archimedes' Polygon of Exhaustion (12-gon inscribed at r=182) -->
    <polygon points="182,0 157.62,91 91,157.62 0,182 -91,157.62 -157.62,91 -182,0 -157.62,-91 -91,-157.62 0,-182 91,-157.62 157.62,-91"
             fill="none" stroke="#4BA3E3" stroke-width="0.7" stroke-opacity="0.28"/>

    <!-- Orthogonal Construction Axes -->
    <line x1="-216" y1="0" x2="216" y2="0" stroke="#334155" stroke-width="0.8" stroke-dasharray="5,4"/>
    <line x1="0" y1="-216" x2="0" y2="216" stroke="#334155" stroke-width="0.8" stroke-dasharray="5,4"/>

    <!-- =================================================================== -->
    <!-- RIGHT CIRCULAR CYLINDER (Radius R = 144, Height 2R = 288)           -->
    <!-- =================================================================== -->
    <line x1="-144" y1="-144" x2="-144" y2="144" stroke="#94A3B8" stroke-width="1.3" stroke-opacity="0.75"/>
    <line x1="144" y1="-144" x2="144" y2="144" stroke="#94A3B8" stroke-width="1.3" stroke-opacity="0.75"/>
    <line x1="-144" y1="-144" x2="144" y2="-144" stroke="#64748B" stroke-width="0.85" stroke-opacity="0.45"/>
    <line x1="-144" y1="144" x2="144" y2="144" stroke="#64748B" stroke-width="0.85" stroke-opacity="0.45"/>

    <!-- Cylinder Top Base Ellipse -->
    <ellipse cx="0" cy="-144" rx="144" ry="32" fill="#4BA3E3" fill-opacity="0.025" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Cylinder Bottom Base Ellipse -->
    <path d="M -144 144 A 144 32 0 0 1 144 144" fill="none" stroke="#64748B" stroke-width="0.95" stroke-dasharray="4,4" stroke-opacity="0.55"/>
    <path d="M -144 144 A 144 32 0 0 0 144 144" fill="none" stroke="#94A3B8" stroke-width="1.3" stroke-opacity="0.85"/>

    <!-- =================================================================== -->
    <!-- INSCRIBED CONE (Apex (0, -144), Base [-144..144, 144])              -->
    <!-- =================================================================== -->
    <polygon points="0,-144 -144,144 144,144" fill="#E5A93C" fill-opacity="0.03"/>
    <line x1="0" y1="-144" x2="-144" y2="144" stroke="#64748B" stroke-width="1.05" stroke-dasharray="5,3" stroke-opacity="0.6"/>
    <line x1="0" y1="-144" x2="144" y2="144" stroke="#64748B" stroke-width="1.05" stroke-dasharray="5,3" stroke-opacity="0.6"/>

    <!-- =================================================================== -->
    <!-- INSCRIBED SPHERE (Radius R = 144)                                   -->
    <!-- =================================================================== -->
    <circle cx="0" cy="0" r="144" fill="#E5A93C" fill-opacity="0.03" stroke="#E5A93C" stroke-width="2.2" stroke-opacity="0.95"/>

    <!-- Equatorial Great Circle Projection -->
    <path d="M -144 0 A 144 38 0 0 1 144 0" fill="none" stroke="#E5A93C" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.45"/>
    <path d="M -144 0 A 144 38 0 0 0 144 0" fill="none" stroke="#E5A93C" stroke-width="1.4" stroke-opacity="0.85"/>

    <!-- Meridian Great Circle Projection -->
    <ellipse cx="0" cy="0" rx="48" ry="144" fill="none" stroke="#E5A93C" stroke-width="0.9" stroke-dasharray="3,3" stroke-opacity="0.38"/>

    <!-- =================================================================== -->
    <!-- OLYMPIAD TRIANGLE ABC, NINE-POINT CIRCLE & EULER LINE               -->
    <!-- Circumcircle radius R = 144:                                        -->
    <!--   A = (28.8, -141.09)                                               -->
    <!--   B = (-124.71, 72)                                                 -->
    <!--   C = (124.71, 72)                                                  -->
    <!--   O = (0, 0), N = (14.4, 1.46), H = (28.8, 2.91)                    -->
    <!-- =================================================================== -->
    <polygon points="28.8,-141.09 -124.71,72 124.71,72" fill="#4BA3E3" fill-opacity="0.06" stroke="#4BA3E3" stroke-width="1.85" stroke-linejoin="round"/>

    <!-- Altitude from A to BC -->
    <line x1="28.8" y1="-141.09" x2="28.8" y2="72" stroke="#4BA3E3" stroke-width="0.95" stroke-opacity="0.65"/>
    <polyline points="28.8,62 38.8,62 38.8,72" fill="none" stroke="#4BA3E3" stroke-width="0.95" stroke-opacity="0.8"/>

    <!-- Nine-Point Circle (Radius R/2 = 72, Center N = (14.4, 1.46)) -->
    <circle cx="14.4" cy="1.46" r="72" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.8" stroke-dasharray="3,2"/>

    <!-- Euler Line through O, N, H -->
    <line x1="-64" y1="-6.47" x2="92" y2="9.3" stroke="#E5A93C" stroke-width="1.4" stroke-opacity="0.9"/>

    <!-- Caliper Dimension Markers (x = 166) -->
    <g stroke="#64748B" stroke-width="0.9">
      <line x1="152" y1="-144" x2="174" y2="-144"/>
      <line x1="152" y1="0" x2="170" y2="0"/>
      <line x1="152" y1="144" x2="174" y2="144"/>
      <line x1="166" y1="-144" x2="166" y2="144"/>
    </g>
    <text x="178" y="-68" font-family="'Times New Roman', Georgia, serif" font-style="italic" font-size="15" fill="#94A3B8">r</text>
    <text x="178" y="76" font-family="'Times New Roman', Georgia, serif" font-style="italic" font-size="15" fill="#94A3B8">r</text>

    <!-- Tangency Points of Sphere & Cylinder -->
    <circle cx="0" cy="-144" r="3.4" fill="#E5A93C"/>
    <circle cx="0" cy="144" r="3.4" fill="#E5A93C"/>
    <circle cx="-144" cy="0" r="3.4" fill="#E5A93C"/>
    <circle cx="144" cy="0" r="3.4" fill="#E5A93C"/>

    <!-- Triangle Vertices A, B, C -->
    <circle cx="28.8" cy="-141.09" r="4.2" fill="#0A0F18" stroke="#4BA3E3" stroke-width="2.1"/>
    <circle cx="-124.71" cy="72" r="4.2" fill="#0A0F18" stroke="#4BA3E3" stroke-width="2.1"/>
    <circle cx="124.71" cy="72" r="4.2" fill="#0A0F18" stroke="#4BA3E3" stroke-width="2.1"/>

    <!-- Collinear Euler Centers O, N, H -->
    <circle cx="0" cy="0" r="3.6" fill="#E5A93C"/>
    <circle cx="14.4" cy="1.46" r="3.2" fill="#F4F1EA"/>
    <circle cx="28.8" cy="2.91" r="3.6" fill="#4BA3E3"/>

    <!-- Classical Mathematical Labels -->
    <g font-family="'Times New Roman', Georgia, serif" font-style="italic" font-size="16" fill="#F4F1EA">
      <text x="36" y="-148">A</text>
      <text x="-142" y="86">B</text>
      <text x="132" y="86">C</text>
      <text x="-18" y="-8" fill="#E5A93C">O</text>
      <text x="8" y="21" fill="#CBD5E1" font-size="14">N</text>
      <text x="36" y="-4" fill="#4BA3E3">H</text>
    </g>
  </g>

  <!-- Bottom Plate Caption -->
  <g font-family="'Times New Roman', Georgia, serif" font-style="italic" font-size="16" fill="#94A3B8">
    <text x="744" y="558">3 + 10/71 &lt; &#960; &lt; 3 + 1/7</text>
    <text x="976" y="558" text-anchor="middle" fill="#E5A93C">V = &#8532;&#960;r&#179;  ·  S = 4&#960;r&#178;</text>
    <text x="1208" y="558" text-anchor="end" fill="#4BA3E3">OH = 2&#183;ON = 3&#183;OG</text>
  </g>
</svg>
