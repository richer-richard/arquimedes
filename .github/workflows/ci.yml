name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      # The tests build their own five-problem corpus, so skip the 1.3 GB of shards
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            arquimedes
            tools
            tests
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Self-test tools/lib
        run: uv run python tools/lib/selftest.py
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -t . -v
